# Poached Egg Left に接続する Peripheral
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Bluetooth：接続先は Left 1台
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# キー入力・トラックボール入力は Left 経由で送信する
CONFIG_ZMK_USB=n
CONFIG_ZMK_STUDIO=n

# GPIO
CONFIG_NFCT_PINS_AS_GPIOS=y

# バッテリー
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# トラックボール
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_PMW3610_ALT=y
